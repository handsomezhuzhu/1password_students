name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-progress Pages deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$GH_REPO"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GITHUB_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          deployments=$(curl -fsSL "${headers[@]}" "$api/deployments?environment=github-pages&per_page=20")
          echo "$deployments" | jq -r '.[] | [.id, .sha] | @tsv' | while IFS=$'\t' read -r id sha; do
            state=$(curl -fsSL "${headers[@]}" "$api/deployments/$id/statuses" | jq -r '.[0].state // empty')
            case "$state" in
              waiting|queued|in_progress)
                echo "Cancelling Pages deployment $sha ($state)."
                status=$(curl -L -sS -o /tmp/pages-cancel-response.txt -w "%{http_code}" \
                  -X POST "${headers[@]}" "$api/pages/deployments/$sha/cancel")
                if [ "$status" = "204" ] || [ "$status" = "404" ]; then
                  echo "Cancel request for $sha returned HTTP $status."
                else
                  echo "Failed to cancel Pages deployment $sha. HTTP $status"
                  cat /tmp/pages-cancel-response.txt
                  exit 1
                fi
                ;;
            esac
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site files
        run: |
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html "$RUNNER_TEMP/site/"
          cp README.md "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"
          printf "%s\n" "${{ github.sha }}" > "$RUNNER_TEMP/site/deploy-version.txt"

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/site/." .
          git add -A
          git commit -m "deploy: publish static site" || echo "No changes to deploy"
          git push origin gh-pages
