name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -L -sS -o /tmp/pages-cancel-response.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/6a192210c5bdc3ff7896ed505fd403357aae5049/cancel")

          if [ "$status" = "204" ]; then
            echo "Cancelled stale Pages deployment 6a192210c5bdc3ff7896ed505fd403357aae5049."
          elif [ "$status" = "404" ]; then
            echo "No stale Pages deployment found."
          else
            echo "Failed to cancel stale Pages deployment. HTTP $status"
            cat /tmp/pages-cancel-response.txt
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site files
        run: |
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html "$RUNNER_TEMP/site/"
          cp README.md "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/site/." .
          git add -A
          git commit -m "deploy: publish static site" || echo "No changes to deploy"
          git push origin gh-pages
